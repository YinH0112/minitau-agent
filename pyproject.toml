[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "minitau"
version = "0.0.1"
description = "A minimal Python implementation of a Pi-style coding-agent harness."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    # Async agent loop and tool execution
    "anyio>=4.0",

    # Provider HTTP clients and SOCKS proxy support
    "httpx[socks]>=0.27",

    # Version and provider capability comparisons
    "packaging>=24.0",

    # Image message and tool-result support
    "pillow>=11.0",

    # Messages, events, configuration, and validation
    "pydantic>=2.11",

    # Terminal code and Markdown rendering
    "pygments>=2.18",
    "rich>=13.0",

    # Interactive terminal UI
    "textual>=8.2.8",

    # Command-line application
    "typer>=0.12",
]

[project.scripts]
minitau = "minitau_coding.cli:app"

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.5",
]

[tool.hatch.build.targets.wheel]
packages = [
    "src/minitau_ai",
    "src/minitau_agent",
    "src/minitau_coding",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = [".trace"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = "3.12"
strict = true
packages = [
    "minitau_ai",
    "minitau_agent",
    "minitau_coding",
]

[[tool.mypy.overrides]]
module = "pygments.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
asyncio_mode = "auto"